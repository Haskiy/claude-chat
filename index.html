<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Claude">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#CC6B3C">
<title>Claude Chat</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --nav-bg: rgba(255,255,255,0.85);
    --text: #1c1c1e;
    --text-secondary: #8e8e93;
    --bubble-user: #007aff;
    --bubble-user-text: #ffffff;
    --bubble-ai: #e9e9eb;
    --bubble-ai-text: #1c1c1e;
    --input-bg: #ffffff;
    --border: #c6c6c8;
    --accent: #cc6b3c;
    --accent-light: #e89b6a;
    --shadow: rgba(0,0,0,0.06);
    --overlay: rgba(0,0,0,0.35);
    --code-bg: #f4f4f5;
    --code-border: #e4e4e7;
    --radius: 20px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --nav-height: 52px;
    --input-height: 56px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --nav-bg: rgba(28,28,30,0.92);
      --text: #ffffff;
      --text-secondary: #8e8e93;
      --bubble-user: #007aff;
      --bubble-user-text: #ffffff;
      --bubble-ai: #2c2c2e;
      --bubble-ai-text: #ffffff;
      --input-bg: #1c1c1e;
      --border: #38383a;
      --shadow: rgba(0,0,0,0.3);
      --overlay: rgba(0,0,0,0.6);
      --code-bg: #2c2c2e;
      --code-border: #3a3a3c;
    }
  }
  html, body {
    height: 100%; overflow: hidden;
    font-family: var(--font); font-size: 16px;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  input, textarea, [contenteditable] { user-select: text; }

  /* ===== Layout ===== */
  #app {
    display: flex; flex-direction: column;
    height: 100%; height: 100dvh;
    padding-top: var(--safe-t);
    padding-bottom: var(--safe-b);
  }

  /* ===== Nav Bar ===== */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    height: var(--nav-height); padding: 0 16px;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
    position: relative; z-index: 10;
  }
  .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .nav-btn {
    background: none; border: none; color: var(--accent);
    font-size: 17px; padding: 8px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-btn svg { width: 22px; height: 22px; fill: var(--accent); pointer-events: none; }
  .nav-left { min-width: 60px; }
  .nav-right { min-width: 60px; display: flex; justify-content: flex-end; gap: 4px; }
  .nav-center { flex: 1; text-align: center; }

  /* ===== Chat Area ===== */
  #chat {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 12px 12px 4px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 0; }

  /* ===== Empty State ===== */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 40px 20px; text-align: center;
  }
  .empty-state svg { width: 72px; height: 72px; margin-bottom: 16px; }
  .empty-state .emoji-placeholder { font-size: 64px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .empty-state p { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; }
  .empty-state .config-hint {
    font-size: 13px; color: var(--text-secondary);
    background: var(--surface); padding: 12px 20px;
    border-radius: 12px; border: 0.5px solid var(--border);
    touch-action: manipulation;
  }
  .config-hint .link { color: var(--accent); cursor: pointer; font-weight: 500; }
  .config-hint .link-btn {
    display: inline; color: var(--accent); font-weight: 600;
    text-decoration: underline; text-underline-offset: 2px;
    background: none; border: none; font: inherit; font-size: inherit;
    padding: 4px 2px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ===== Message Bubbles ===== */
  .msg-group { margin-bottom: 6px; display: flex; flex-direction: column; }
  .msg-row { display: flex; align-items: flex-end; margin-bottom: 4px; gap: 8px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 14px;
  }
  .msg-avatar.ai {
    background: var(--accent); color: #fff;
    box-shadow: 0 2px 8px rgba(204,107,60,0.25);
  }

  .bubble {
    max-width: 82%; padding: 10px 14px;
    font-size: 16px; line-height: 1.45;
    word-wrap: break-word; overflow-wrap: break-word;
    position: relative;
  }
  .bubble.user {
    background: var(--bubble-user); color: var(--bubble-user-text);
    border-radius: 18px 18px 4px 18px;
  }
  .bubble.assistant {
    background: var(--bubble-ai); color: var(--bubble-ai-text);
    border-radius: 18px 18px 18px 4px;
  }
  .bubble.assistant p { margin: 0 0 8px; }
  .bubble.assistant p:last-child { margin-bottom: 0; }
  .bubble.user p { margin: 0; }

  .msg-time {
    font-size: 11px; color: var(--text-secondary);
    padding: 0 4px; margin-top: 2px;
  }
  .msg-row.user .msg-time { text-align: right; }

  /* ===== Loading Dots ===== */
  .typing {
    display: flex; gap: 5px; padding: 8px 4px; align-items: center;
  }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-secondary);
    animation: typing 1.4s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: 0s; }
  .typing span:nth-child(2) { animation-delay: 0.16s; }
  .typing span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes typing {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 0.9; }
  }

  /* ===== Input Bar ===== */
  .input-bar {
    flex-shrink: 0;
    padding: 8px 12px;
    padding-bottom: max(8px, var(--safe-b));
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--border);
    display: flex; align-items: flex-end; gap: 8px;
  }
  .input-wrap {
    flex: 1; display: flex; align-items: flex-end;
    background: var(--input-bg);
    border-radius: 22px;
    border: 0.5px solid var(--border);
    padding: 4px 4px 4px 14px;
    min-height: 40px;
  }
  .input-wrap textarea {
    flex: 1; border: none; background: none;
    font-family: var(--font); font-size: 16px;
    line-height: 1.35; color: var(--text);
    resize: none; outline: none;
    max-height: 100px;
    padding: 6px 0;
  }
  .input-wrap textarea::placeholder { color: var(--text-secondary); }
  .send-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
    transition: opacity 0.15s, transform 0.1s;
  }
  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.3; }
  .send-btn svg { width: 18px; height: 18px; fill: #fff; margin-left: 2px; pointer-events: none; }

  /* ===== Settings Overlay ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--overlay);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .settings {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 101;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    max-height: 85vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    padding: 0 0 calc(16px + var(--safe-b));
    -webkit-overflow-scrolling: touch;
  }
  .settings.open { transform: translateY(0); }
  .settings-handle {
    width: 36px; height: 5px; border-radius: 3px;
    background: var(--border); margin: 8px auto 4px;
  }
  .settings-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px 12px;
    border-bottom: 0.5px solid var(--border);
  }
  .settings-header h2 { font-size: 17px; font-weight: 600; }
  .settings-close {
    background: none; border: none; font-size: 17px; color: var(--accent); cursor: pointer; padding: 4px 8px;
  }
  .settings-section { padding: 16px 20px; border-bottom: 0.5px solid var(--border); }
  .settings-section:last-child { border-bottom: none; }
  .settings-label {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .settings-field {
    width: 100%;
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    font-family: var(--mono); font-size: 14px; color: var(--text);
    outline: none;
  }
  .settings-field:focus { border-color: var(--accent); }
  .settings-btn {
    display: block; width: 100%; margin-top: 10px;
    padding: 10px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .settings-btn:active { opacity: 0.8; }
  .settings-btn.danger {
    background: transparent; color: #ff3b30;
    border: 0.5px solid var(--border); margin-top: 4px;
  }
  .settings-btn.success { background: #34c759; }

  .model-list { display: flex; flex-direction: column; gap: 6px; }
  .model-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; transition: background 0.15s;
    border: 0.5px solid transparent;
  }
  .model-item:active { background: var(--bg); }
  .model-item.selected { border-color: var(--accent); background: var(--bg); }
  .model-dot {
    width: 20px; height: 20px; border-radius: 10px;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s;
  }
  .model-item.selected .model-dot { border-color: var(--accent); }
  .model-dot-inner {
    width: 10px; height: 10px; border-radius: 5px;
    background: var(--accent); transform: scale(0);
    transition: transform 0.15s;
  }
  .model-item.selected .model-dot-inner { transform: scale(1); }
  .model-info { flex: 1; }
  .model-name { font-size: 15px; font-weight: 500; }
  .model-desc { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    background: var(--accent); color: #fff;
    padding: 2px 8px; border-radius: 10px;
  }

  .status-ok { color: #34c759; font-size: 14px; }

  /* ===== Markdown Styles in Assistant Bubbles ===== */
  .bubble.assistant h1, .bubble.assistant h2, .bubble.assistant h3 {
    margin: 10px 0 6px; font-weight: 600;
  }
  .bubble.assistant h1 { font-size: 20px; }
  .bubble.assistant h2 { font-size: 18px; }
  .bubble.assistant h3 { font-size: 16px; }
  .bubble.assistant ul, .bubble.assistant ol {
    margin: 4px 0; padding-left: 20px;
  }
  .bubble.assistant li { margin-bottom: 2px; }
  .bubble.assistant blockquote {
    margin: 6px 0; padding: 4px 0 4px 12px;
    border-left: 3px solid var(--accent); color: var(--text-secondary);
  }
  .bubble.assistant code {
    font-family: var(--mono); font-size: 14px;
    background: var(--code-bg); padding: 1px 5px;
    border-radius: 4px; border: 0.5px solid var(--code-border);
  }
  .bubble.assistant pre {
    margin: 8px 0; background: var(--code-bg);
    border-radius: 10px; border: 0.5px solid var(--code-border);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .bubble.assistant pre code {
    display: block; padding: 10px 12px;
    background: none; border: none; border-radius: 0;
    font-size: 13px; line-height: 1.5; white-space: pre;
  }
  .bubble.assistant hr {
    margin: 10px 0; border: none; border-top: 0.5px solid var(--border);
  }
  .bubble.assistant a { color: var(--accent); text-decoration: underline; }
  .bubble.assistant strong { font-weight: 600; }
  .bubble.assistant em { font-style: italic; }
  .bubble.assistant p code { font-size: 14px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: calc(60px + var(--safe-t)); left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--text);
    padding: 8px 20px; border-radius: 14px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 4px 20px var(--shadow);
    border: 0.5px solid var(--border);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: #ff3b30; color: #ff3b30; }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <!-- Nav -->
  <header class="nav">
    <div class="nav-left"></div>
    <div class="nav-center"><span class="nav-title">Claude</span></div>
    <div class="nav-right">
      <button class="nav-btn" id="clearBtn" title="清空对话" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
      <button class="nav-btn" id="settingsBtn">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.611 3.611 0 0 1 12 15.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- Chat -->
  <div id="chat">
    <div class="empty-state" id="emptyState">
      <div class="emoji-placeholder">✦</div>
      <h2>Claude 聊天</h2>
      <p>开始一段对话吧</p>
      <div class="config-hint" id="configHint">
        <span id="hintText">请先 <button class="nav-btn link-btn" id="hintLink">设置 API Key</button></span>
      </div>
    </div>
    <div id="messages" style="display:none"></div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息..." maxlength="32000"></textarea>
      <button class="send-btn" id="sendBtn" disabled aria-label="发送">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Settings Overlay -->
<div class="overlay" id="overlay"></div>
<div class="settings" id="settings">
  <div class="settings-handle"></div>
  <div class="settings-header">
    <h2>设置</h2>
    <button class="settings-close" id="settingsClose">关闭</button>
  </div>

  <div class="settings-section">
    <div class="settings-label">🔑 API 密钥</div>
    <input class="settings-field" id="apiKeyInput" type="password" placeholder="sk-ant-..." autocomplete="off">
    <button class="settings-btn" id="saveKeyBtn">保存</button>
    <button class="settings-btn danger" id="clearKeyBtn" style="display:none">清除 API Key</button>
    <div style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">
      在 <a href="https://console.anthropic.com" target="_blank" style="color:var(--accent)">console.anthropic.com</a> 获取 API Key
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-label">🖥 模型选择</div>
    <div class="model-list" id="modelList"></div>
  </div>

  <div class="settings-section">
    <div class="settings-label">ℹ️ 关于</div>
    <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0">
      <span>版本</span>
      <span style="color:var(--text-secondary)">1.0.0</span>
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);text-align:center;">
      使用 Anthropic Claude API · 数据仅存储在本地
    </div>
  </div>

  <div class="settings-section">
    <button class="settings-btn danger" id="clearChatBtn">清空所有对话</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== Configuration =====
const MODELS = [
  { id: 'claude-sonnet-4-20250514', name: 'Claude Sonnet 4', desc: '平衡速度与智能，推荐', badge: '推荐' },
  { id: 'claude-haiku-3-5-20241022', name: 'Claude Haiku 3.5', desc: '快速轻量，适合简单任务' },
  { id: 'claude-opus-4-20250514', name: 'Claude Opus 4', desc: '最强能力，复杂推理' }
];
const STORAGE_KEYS = {
  messages: 'claude_messages',
  apiKey: 'claude_api_key',
  model: 'claude_model'
};
const ANTHROPIC_VERSION = '2023-06-01';

// ===== State =====
let state = {
  messages: [],
  apiKey: '',
  model: 'claude-sonnet-4-20250514',
  isStreaming: false,
  abortController: null
};

// ===== DOM =====
const $ = id => document.getElementById(id);
const chat = $('chat');
const messagesEl = $('messages');
const emptyState = $('emptyState');
const input = $('input');
const sendBtn = $('sendBtn');
const settingsBtn = $('settingsBtn');
const clearBtn = $('clearBtn');
const overlay = $('overlay');
const settings = $('settings');
const settingsClose = $('settingsClose');
const apiKeyInput = $('apiKeyInput');
const saveKeyBtn = $('saveKeyBtn');
const clearKeyBtn = $('clearKeyBtn');
const modelList = $('modelList');
const clearChatBtn = $('clearChatBtn');
const toast = $('toast');
const hintText = $('hintText');
const hintLink = $('hintLink');
const configHint = document.getElementById('configHint');

// ===== Storage =====
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEYS.messages);
    if (saved) state.messages = JSON.parse(saved);
  } catch(e) {}
  state.apiKey = localStorage.getItem(STORAGE_KEYS.apiKey) || '';
  state.model = localStorage.getItem(STORAGE_KEYS.model) || MODELS[0].id;
}

function saveMessages() {
  const data = state.messages.map(m => ({ role: m.role, content: m.content, time: m.time }));
  localStorage.setItem(STORAGE_KEYS.messages, JSON.stringify(data));
}

// ===== Toast =====
let toastTimer = null;
function showToast(msg, isError = false) {
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  requestAnimationFrame(() => {
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  });
}

// ===== Markdown Parser =====
function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function renderMarkdown(text) {
  let html = '';
  const lines = text.split('\n');
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Code block
    if (/^```/.test(line)) {
      const lang = line.replace(/^```/, '').trim();
      let code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) {
        code.push(lines[i]);
        i++;
      }
      i++; // skip closing ```
      const codeHtml = escapeHtml(code.join('\n'));
      html += `<pre><code>${codeHtml}</code></pre>`;
      continue;
    }

    // Divider
    if (/^(---|\*\*\*|___)\s*$/.test(line.trim())) {
      html += '<hr>';
      i++;
      continue;
    }

    // Heading
    const hMatch = line.match(/^(#{1,3})\s+(.+)/);
    if (hMatch) {
      const level = hMatch[1].length;
      html += `<h${level}>${renderInline(hMatch[2])}</h${level}>`;
      i++;
      continue;
    }

    // Blockquote
    if (/^>\s/.test(line)) {
      let quotes = [];
      while (i < lines.length && /^>\s/.test(lines[i])) {
        quotes.push(lines[i].replace(/^>\s/, ''));
        i++;
      }
      html += `<blockquote>${renderInline(quotes.join('<br>'))}</blockquote>`;
      continue;
    }

    // Bullet list
    if (/^[-*]\s/.test(line)) {
      let items = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i])) {
        items.push(lines[i].replace(/^[-*]\s/, ''));
        i++;
      }
      html += '<ul>' + items.map(item => `<li>${renderInline(item)}</li>`).join('') + '</ul>';
      continue;
    }

    // Numbered list
    if (/^\d+\.\s/.test(line)) {
      let items = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        items.push(lines[i].replace(/^\d+\.\s/, ''));
        i++;
      }
      html += '<ol>' + items.map(item => `<li>${renderInline(item)}</li>`).join('') + '</ol>';
      continue;
    }

    // Empty line
    if (/^\s*$/.test(line)) {
      i++;
      continue;
    }

    // Paragraph
    let para = [];
    while (i < lines.length) {
      if (/^\s*$/.test(lines[i]) || /^(#{1,3}|```|> |[-*]\s|\d+\.\s)/.test(lines[i])) break;
      para.push(lines[i]);
      i++;
    }
    if (para.length > 0) {
      html += `<p>${renderInline(para.join('<br>'))}</p>`;
    }
  }

  return html;
}

function renderInline(text) {
  let t = escapeHtml(text);
  // Inline code
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__(.+?)__/g, '<strong>$1</strong>');
  // Italic
  t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  t = t.replace(/(?<!_)_(?!_)(.+?)(?<!_)_(?!_)/g, '<em>$1</em>');
  // Links
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  return t;
}

// ===== Render Messages =====
function renderMessages(animate = false) {
  if (state.messages.length === 0) {
    messagesEl.style.display = 'none';
    emptyState.style.display = 'flex';
    clearBtn.style.display = 'none';

    if (state.apiKey) {
      hintText.textContent = '开始输入消息吧';
    } else {
      hintText.innerHTML = '请先 <button class="nav-btn link-btn" id="hintLink">设置 API Key</button>';
    }
    return;
  }

  emptyState.style.display = 'none';
  messagesEl.style.display = 'block';
  clearBtn.style.display = 'flex';

  messagesEl.innerHTML = state.messages.map((msg, idx) => {
    const time = msg.time ? formatTime(msg.time) : '';
    if (msg.role === 'user') {
      return `<div class="msg-group"><div class="msg-row user"><div class="bubble user"><p>${escapeHtml(msg.content)}</p></div></div><div class="msg-row user"><div class="msg-time">${time}</div></div></div>`;
    } else {
      const content = msg.content ? renderMarkdown(msg.content) : '';
      return `<div class="msg-group"><div class="msg-row assistant"><div class="msg-avatar ai">✦</div><div class="bubble assistant">${content || '<span style="opacity:0.4">...</span>'}</div></div><div class="msg-row assistant"><div style="width:38px"></div><div class="msg-time">${time}</div></div></div>`;
    }
  }).join('');

  if (state.isStreaming) {
    messagesEl.insertAdjacentHTML('beforeend',
      `<div class="msg-group" id="streamIndicator"><div class="msg-row assistant"><div class="msg-avatar ai">✦</div><div class="bubble assistant"><div class="typing"><span></span><span></span><span></span></div></div></div></div>`
    );
  }

  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// ===== API =====
async function streamChat(history) {
  if (state.abortController) {
    state.abortController.abort();
  }
  state.abortController = new AbortController();

  const messages = history.map(m => ({ role: m.role, content: m.content }));

  const body = JSON.stringify({
    model: state.model,
    max_tokens: 4096,
    stream: true,
    messages: messages
  });

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': ANTHROPIC_VERSION
    },
    body,
    signal: state.abortController.signal
  });

  if (!response.ok) {
    let errMsg = `HTTP ${response.status}`;
    try {
      const err = await response.json();
      errMsg = err.error?.message || errMsg;
    } catch(e) {}
    throw new Error(errMsg);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split('\n');
    buffer = parts.pop() || '';

    for (const part of parts) {
      const trimmed = part.trim();
      if (trimmed.startsWith('data: ')) {
        const data = trimmed.slice(6);
        if (data === '[DONE]') continue;
        try {
          const event = JSON.parse(data);
          if (event.type === 'content_block_delta' && event.delta?.text) {
            fullText += event.delta.text;
          }
        } catch(e) {}
      }
    }

    // Progressive update
    const lastMsg = state.messages[state.messages.length - 1];
    if (lastMsg && lastMsg.role === 'assistant') {
      lastMsg.content = fullText;
    }
    renderMessages();
  }

  // Handle leftover
  if (buffer.trim().startsWith('data: ')) {
    const data = buffer.trim().slice(6);
    if (data !== '[DONE]') {
      try {
        const event = JSON.parse(data);
        if (event.type === 'content_block_delta' && event.delta?.text) {
          fullText += event.delta.text;
        }
      } catch(e) {}
    }
  }

  // Final update
  const lastMsg = state.messages[state.messages.length - 1];
  if (lastMsg && lastMsg.role === 'assistant') {
    lastMsg.content = fullText;
    lastMsg.time = new Date().toISOString();
  }
  renderMessages();
  saveMessages();

  return fullText;
}

// ===== Send Message =====
async function sendMessage() {
  const text = input.value.trim();
  if (!text || state.isStreaming) return;

  if (!state.apiKey) {
    showToast('请先在设置中配置 API Key', true);
    openSettings();
    return;
  }

  // Add user message
  state.messages.push({ role: 'user', content: text, time: new Date().toISOString() });
  // Add empty assistant message
  state.messages.push({ role: 'assistant', content: '', time: null });
  input.value = '';
  autoResize();
  renderMessages();
  saveMessages();

  state.isStreaming = true;
  sendBtn.disabled = true;

  try {
    await streamChat(state.messages.slice(0, -1));
  } catch (err) {
    if (err.name === 'AbortError') {
      // Remove unfinished message
      if (state.messages.length > 0 && state.messages[state.messages.length - 1].role === 'assistant') {
        state.messages.pop();
      }
      showToast('已取消');
    } else {
      // Remove the empty assistant message
      if (state.messages.length > 0 && state.messages[state.messages.length - 1].role === 'assistant') {
        if (!state.messages[state.messages.length - 1].content) {
          state.messages.pop();
        }
      }
      showToast(err.message || '请求失败', true);
    }
  } finally {
    state.isStreaming = false;
    state.abortController = null;
    sendBtn.disabled = false;
    renderMessages();
    saveMessages();
    input.focus();
  }
}

function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
}

// ===== Settings =====
function openSettings() {
  overlay.classList.add('open');
  settings.classList.add('open');
  apiKeyInput.value = state.apiKey;
  updateKeyButtons();
  renderModels();
  setTimeout(() => apiKeyInput.focus(), 350);
}

function closeSettings() {
  overlay.classList.remove('open');
  settings.classList.remove('open');
}

function updateKeyButtons() {
  saveKeyBtn.textContent = state.apiKey ? '更新' : '保存';
  saveKeyBtn.className = 'settings-btn' + (state.apiKey ? ' success' : '');
  clearKeyBtn.style.display = state.apiKey ? 'block' : 'none';
}

function renderModels() {
  modelList.innerHTML = MODELS.map(m => `
    <div class="model-item ${state.model === m.id ? 'selected' : ''}" data-model="${m.id}">
      <div class="model-dot"><div class="model-dot-inner"></div></div>
      <div class="model-info">
        <div class="model-name">${m.name} ${m.badge ? `<span class="badge">${m.badge}</span>` : ''}</div>
        <div class="model-desc">${m.desc}</div>
      </div>
    </div>
  `).join('');

  modelList.querySelectorAll('.model-item').forEach(el => {
    el.addEventListener('click', () => {
      state.model = el.dataset.model;
      localStorage.setItem(STORAGE_KEYS.model, state.model);
      renderModels();
      showToast('已切换至 ' + MODELS.find(m => m.id === state.model)?.name);
    });
  });
}

// ===== Clear =====
function clearChat() {
  if (state.messages.length === 0) return;
  if (!confirm('确定清空所有对话吗？')) return;
  if (state.isStreaming && state.abortController) {
    state.abortController.abort();
  }
  state.messages = [];
  saveMessages();
  renderMessages();
  showToast('对话已清空');
}

// ===== Init =====
function init() {
  loadState();
  renderMessages();

  if (state.apiKey) {
    hintText.textContent = '开始输入消息吧';
  }

  // Input handling
  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim() || state.isStreaming;
    autoResize();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // Settings
  settingsBtn.addEventListener('click', openSettings);
  settingsClose.addEventListener('click', closeSettings);
  overlay.addEventListener('click', closeSettings);

  saveKeyBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) { showToast('请输入 API Key', true); return; }
    if (!key.startsWith('sk-ant-')) { showToast('API Key 格式不正确，应以 sk-ant- 开头', true); return; }
    state.apiKey = key;
    localStorage.setItem(STORAGE_KEYS.apiKey, key);
    updateKeyButtons();
    showToast('API Key 已保存');
    if (state.messages.length === 0) {
      hintText.textContent = '开始输入消息吧';
    }
  });

  clearKeyBtn.addEventListener('click', () => {
    if (!confirm('确定清除 API Key 吗？')) return;
    state.apiKey = '';
    localStorage.removeItem(STORAGE_KEYS.apiKey);
    apiKeyInput.value = '';
    updateKeyButtons();
    showToast('API Key 已清除');
    if (state.messages.length === 0) {
      hintText.innerHTML = '请先 <button class="nav-btn link-btn" id="hintLink">设置 API Key</button>';
    }
  });

  clearBtn.addEventListener('click', clearChat);
  clearChatBtn.addEventListener('click', clearChat);

  // Click config hint to open settings (event delegation)
  configHint.addEventListener('click', (e) => {
    if (!state.apiKey && state.messages.length === 0) {
      openSettings();
    }
  });

  // Focus input on tap
  document.addEventListener('touchstart', () => {
    if (!state.isStreaming) setTimeout(() => input.focus(), 100);
  }, { passive: true });

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

// Boot
document.addEventListener('DOMContentLoaded', init);
</script>
